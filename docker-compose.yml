version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: safeear
      POSTGRES_PASSWORD: safeear
      POSTGRES_DB: safeear
    volumes:
      - ./data/db:/var/lib/postgresql/data
    # Published for local inspection only; remove on any shared machine.
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    image: redis:7-alpine
    # Not published on the host: only the web container needs it.

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgres://safeear:safeear@postgres:5432/safeear
      SAFEEAR_DATA_ROOT: /data/safeear
      REDIS_URL: redis://redis:6379/0
      SAFEEAR_JWT_SECRET: dev-secret
    volumes:
      - .:/app:cached
      - ./data:/data/safeear
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
